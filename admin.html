<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#C9A24B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/admin-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agenda · Barbería</title>
<link rel="stylesheet" href="app.css">
<style>
body{margin:0;background:#0f0f10;color:#f5f1e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
main{max-width:980px;margin:0 auto;padding:1rem 1rem 4rem}
h1{font-size:1.2rem;letter-spacing:.12em;text-transform:uppercase;color:#E6C57A;margin:.2rem 0 1rem}
h2{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:#C9A24B;margin:1.6rem 0 .6rem}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.row{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin:.6rem 0}
.item{border:1px solid #2c2c2f;background:#1d1d1f;border-radius:.9rem;padding:.8rem 1rem;margin:.5rem 0;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.item small{color:#a8a29a;display:block}
.tag{font-size:.7rem;font-weight:800;border-radius:99px;padding:.15rem .55rem;border:1px solid #2c2c2f}
.tag.done{color:#7BC47F;border-color:#7BC47F}.tag.noshow{color:#E07A6B;border-color:#E07A6B}.tag.cancelled{color:#a8a29a}
.acts{display:flex;flex-wrap:wrap;gap:.4rem}
.acts button,.acts a{min-height:38px;font-size:.8rem;padding:0 .8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.stat{background:#1d1d1f;border:1px solid #2c2c2f;border-radius:.9rem;padding:.8rem}.stat b{display:block;font-size:1.6rem;color:#E6C57A}
table{width:100%;border-collapse:collapse}td,th{padding:.4rem .3rem;text-align:left;font-size:.85rem}
input,select{min-width:0}

.item{text-align:left;font:inherit;color:inherit}button.item{width:100%;cursor:pointer}
.tag.booked{color:#E6C57A;border-color:#C9A24B}
.tbl{overflow-x:auto}.nw{white-space:nowrap;color:#a8a29a}
.sh-t{margin:0 0 .5rem;font-size:1.15rem;color:#E6C57A}.sh-l{margin:.2rem 0 .8rem;color:#d6d0c4;line-height:1.5}.sh-c{margin:.4rem 0}
.cx-in h2{margin:1.1rem 0 .5rem}
textarea.bx-in{resize:vertical;font-family:inherit}
.ag-head{display:grid;gap:.5rem;margin-bottom:.8rem}
.ag-nav{display:flex;gap:.4rem;align-items:center}.ag-nav input{width:0;margin:0;flex:1 1 0;min-width:0}.ag-nav .bx-ghost{min-height:42px;padding:0 .8rem;flex:none}
.ag-day{font-size:1.05rem;text-transform:capitalize}
.ag-sum{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.85rem;color:#a8a29a}.ag-sum b{color:#E6C57A;font-size:1rem}
.ag-next{flex-basis:100%;background:#1d1d1f;border:1px solid #3a3320;border-radius:.7rem;padding:.45rem .7rem;color:#f5f1e8}.ag-next small{color:#a8a29a}
.ag-tools{display:grid;gap:.6rem;margin-bottom:.8rem}.ag-chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}.ag-chips .bx-chip{flex:none}
.ag-btns{display:flex;flex-wrap:wrap;gap:.5rem}.ag-foot{margin-top:.8rem}
.tl{display:flex;position:relative;border:1px solid #2c2c2f;border-radius:.9rem;background:#141415;overflow:auto;max-height:68vh;-webkit-overflow-scrolling:touch}
.tl-axis{position:sticky;left:0;z-index:5;background:#141415;width:46px;flex:none;border-right:1px solid #2c2c2f}
.tl-h{position:sticky;top:0;z-index:4;height:32px;display:flex;align-items:center;justify-content:center;background:#1d1d1f;border-bottom:1px solid #2c2c2f;font-size:.8rem;font-weight:800;color:#E6C57A;white-space:nowrap;overflow:hidden;padding:0 .3rem}
.tl-axis .tl-h{z-index:6}
.tl-col{flex:1 0 118px;border-left:1px solid #232326;min-width:0}
.tl-body{position:relative;cursor:copy;background-image:linear-gradient(to bottom,#2a2a2d 0,#2a2a2d 1px,transparent 1px),linear-gradient(to bottom,#1d1d1f 0,#1d1d1f 1px,transparent 1px);background-size:100% var(--hp),100% calc(var(--hp)/2)}
.tl-axis .tl-body{cursor:default}.tl-axis span{position:absolute;right:6px;font-size:.7rem;color:#a8a29a;transform:translateY(-50%);background:#141415;padding:0 2px}
.tl-axis span:first-child{transform:none}
.tl-x{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#19191b,#19191b 6px,#141415 6px,#141415 12px);pointer-events:none;opacity:.95}
.tl-b{position:absolute;left:3px;right:3px;display:block;box-sizing:border-box;margin:0;padding:.2rem .4rem;border-radius:.55rem;border:1px solid #C9A24B;background:#2a2417;color:#f5f1e8;font:inherit;font-size:.75rem;line-height:1.2;text-align:left;overflow:hidden;cursor:pointer;z-index:2}
.tl-b b{color:#E6C57A}.tl-b small{display:block;color:#a8a29a;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b.s-done{background:#15251a;border-color:#4d8f52}.tl-b.s-done b{color:#7BC47F}
.tl-b.s-noshow{background:#2b1816;border-color:#b3584c}.tl-b.s-noshow b{color:#E07A6B}
.tl-k{background:repeating-linear-gradient(45deg,#26262a,#26262a 6px,#1d1d20 6px,#1d1d20 12px);border-color:#4a4a50;color:#a8a29a;z-index:1}
.tl-b:focus-visible,.tl-body:focus-visible{outline:3px solid rgba(201,162,75,.6);outline-offset:1px}
.tl-now{position:absolute;left:46px;right:0;height:2px;background:#e0645a;z-index:3;pointer-events:none}
.ag-li{display:flex;align-items:center}
.bars{display:grid;gap:.35rem}.bar-r{display:grid;grid-template-columns:5.2rem 1fr 4.6rem;gap:.5rem;align-items:center;font-size:.8rem}
.bar-l{color:#d6d0c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-t{background:#1d1d1f;border-radius:99px;height:.7rem;overflow:hidden}.bar-t i{display:block;height:100%;background:linear-gradient(90deg,#C9A24B,#E6C57A);border-radius:99px}.bar-v{text-align:right;color:#E6C57A;font-weight:700}
@media(max-width:480px){.bar-r{grid-template-columns:4.2rem 1fr 4rem}}
#pushmsg{margin:0 0 .5rem!important;min-height:0}#pushmsg:empty{display:none}
#tools{margin-bottom:.5rem;gap:.4rem}#tools .bx-ghost{min-height:38px;padding:0 .8rem;font-size:.8rem}
#tabs{flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}#tabs .bx-chip{flex:none;min-height:38px;padding:0 .9rem;font-size:.85rem}
.ag-btns{flex-wrap:nowrap}.ag-btns .bx-btn,.ag-btns .bx-ghost{min-height:42px;padding:0 .85rem;font-size:.85rem;white-space:nowrap}
.sh-t{text-transform:none;letter-spacing:0}
.seg{display:inline-flex;border:1px solid #3a3320;border-radius:999px;overflow:hidden;margin-right:.5rem;vertical-align:middle;text-transform:none}
.seg button{background:transparent;border:0;color:#d6d0c4;font:inherit;font-size:.8rem;font-weight:700;min-height:34px;padding:0 .85rem;cursor:pointer}
.seg button[aria-pressed=true]{background:#C9A24B;color:#111}
.seg button:focus-visible{outline:3px solid rgba(201,162,75,.6);outline-offset:-3px}
.ag-range{flex:1;text-align:center;font-weight:700;text-transform:capitalize;font-size:.9rem}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.wk-day{display:flex;flex-direction:column;gap:.3rem;text-align:left;background:#141415;border:1px solid #2c2c2f;border-radius:.9rem;padding:.65rem .7rem;color:#f5f1e8;font:inherit;cursor:pointer;min-height:92px}
.wk-day:hover{border-color:#5a4a22}.wk-day.today{border-color:#C9A24B;box-shadow:0 0 0 1px #C9A24B inset}.wk-day.closed{opacity:.55}
.wk-day:focus-visible{outline:3px solid rgba(201,162,75,.6);outline-offset:2px}
.wk-top{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;text-transform:capitalize}.wk-top b{color:#E6C57A}
.wk-day small{color:#a8a29a;font-size:.74rem;line-height:1.3}.wk-first{color:#d6d0c4!important}
.wk-bar{background:#1d1d1f;border-radius:99px;height:.5rem;overflow:hidden}.wk-bar i{display:block;height:100%;background:linear-gradient(90deg,#C9A24B,#E6C57A);border-radius:99px}.wk-bar i.full{background:linear-gradient(90deg,#d9822b,#e0645a)}
.ag-wait{display:block;width:100%;text-align:left;margin:0 0 .7rem;background:#2a2417;border:1px solid #C9A24B;border-radius:.8rem;color:#f5f1e8;font:inherit;font-size:.85rem;padding:.55rem .8rem;cursor:pointer}
.wdays{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}.wdays .bx-chip{min-width:42px;justify-content:center}
.bx-chk{display:flex;align-items:center;gap:.5rem;margin:.8rem 0 .3rem;font-size:.9rem}.bx-chk input{width:20px;height:20px;accent-color:#C9A24B}
@media(prefers-reduced-motion:reduce){.wk-bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Barbería · Agenda</h1>
<p id="who" class="bx-small" style="margin:-.6rem 0 .8rem"></p>
<div id="login" class="cx" style="max-width:360px">
<label class="bx-lab" for="tk">Contraseña o clave de acceso</label><input id="tk" class="bx-in" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false">
<label style="display:flex;gap:.5rem;align-items:center;margin:.6rem 0;font-size:.9rem;color:#d6d0c4"><input id="rm" type="checkbox" checked> Recordarme en este móvil</label>
<p id="lm" class="bx-msg" role="status"></p><button id="lg" type="button" class="bx-btn" style="width:100%">Entrar</button>
</div>
<div id="app" hidden>
<div class="bar" id="tools" style="justify-content:space-between"><div class="acts"><button type="button" class="bx-ghost" id="pushbtn">🔔 Avisos de citas</button><button type="button" class="bx-ghost" id="pushtest" hidden>Probar aviso</button><button type="button" class="bx-ghost" data-install hidden>Instalar la app</button></div><span class="acts"><a class="bx-ghost" href="/?web=1" style="display:inline-flex;align-items:center;text-decoration:none">Web de clientes</a><button type="button" class="bx-ghost" id="out">Salir</button></span></div>
<p id="pushmsg" class="bx-msg" role="status" style="margin:.2rem 0 .8rem"></p>
<div class="bar" role="tablist" id="tabs"></div>
<div id="view"></div>
</div>
</main>

<script src="pwa.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
